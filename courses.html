<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Courses — Campus360</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>#sidebar{height:100vh;overflow:auto}</style>
</head>
<body class="min-h-screen bg-gray-50">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="w-72 bg-white border-r"></aside>
    <main class="flex-1 p-8">
      <h2 class="text-2xl font-bold mb-4">Courses</h2>
      <div class="mb-4">
        <form id="addCourse" class="flex gap-2">
          <input id="courseTitle" placeholder="Course title" class="flex-1 px-3 py-2 border rounded" />
          <button class="bg-indigo-600 text-white px-4 py-2 rounded" type="submit">Add</button>
        </form>
      </div>
      <div id="coursesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { getFirestore, addDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const firebaseConfig = {

      apiKey: "AIzaSyCqK5TUrvEHB8tBzegXf3g517EUouHvGtg",
      authDomain: "final-project-646be.firebaseapp.com",
      projectId: "final-project-646be",
      storageBucket: "final-project-646be.firebasestorage.app",
      messagingSenderId: "826790861451",
      appId: "1:826790861451:web:43fd311fc290419ab2928e"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, user => {
      if (!user) location.replace('login.html');
      else {
        renderSidebar(user);
        loadCourses(user.uid);
      }
    });

    function renderSidebar(user) {
      const side = document.getElementById('sidebar');
      side.innerHTML = `
        <div class="p-6">
          <h2 class="text-2xl font-bold mb-4">Campus360</h2>
          <div class="mb-4">
            <div id="user-name" class="text-sm text-gray-700">${user.email}</div>
            <div id="user-email" class="text-xs text-gray-500">${user.email}</div>
          </div>
          <nav class="space-y-1">
            ${navLink('Dashboard','dashboard.html')}
            ${navLink('Attendance','attendance.html')}
            ${navLink('Courses','courses.html')}
            ${navLink('Library','library.html')}
            ${navLink('Timetable','timetable.html')}
            ${navLink('Notifications','notifications.html')}
            ${navLink('Profile','profile.html')}
            ${navLink('Settings','settings.html')}
            ${navLink('About','about.html')}
          </nav>
          <div class="mt-6">
            <button id="logoutBtn" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded">Logout</button>
          </div>
        </div>
      `;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await auth.signOut();
        location.replace('index.html');
      });
    }
    function navLink(t,h){ return `<a href="${h}" class="block px-3 py-2 rounded text-gray-700 hover:bg-gray-100">${t}</a>`; }

    async function loadCourses(uid) {
      const container = document.getElementById('coursesContainer');
      container.innerHTML = 'Loading...';
      try {
        const q = query(collection(db, 'courses'), where('ownerUid','==', uid));
        const snaps = await getDocs(q);
        const arr = [];
        snaps.forEach(s => arr.push({ id: s.id, ...s.data() }));
        if (arr.length === 0) container.innerHTML = '<div class="text-gray-500">No courses yet.</div>';
        else container.innerHTML = arr.map(c => `<div class="p-3 border rounded"><h3 class="font-semibold">${c.title}</h3><p class="text-sm">${c.description || ''}</p></div>`).join('');
      } catch (err) {
        container.innerHTML = '<div class="text-red-600">Could not load courses.</div>';
      }
    }

    // add course
    const addForm = document.getElementById('addCourse');
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('courseTitle').value.trim();
      if (!title) return;
      const user = auth.currentUser;
      if (!user) return location.replace('login.html');
      try {
        await addDoc(collection(db,'courses'), { ownerUid: user.uid, title, description: '', createdAt: new Date().toISOString() });
        document.getElementById('courseTitle').value = '';
        loadCourses(user.uid);
      } catch (err) {
        alert('Could not add');
      }
    });
  </script>
</body>
</html>
