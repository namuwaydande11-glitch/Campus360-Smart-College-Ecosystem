<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Attendance — Campus360</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>#sidebar{height:100vh;overflow:auto}</style>
</head>
<body class="min-h-screen bg-gray-50">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="w-72 bg-white border-r"></aside>
    <main class="flex-1 p-8">
      <h2 class="text-2xl font-bold mb-4">Attendance</h2>

      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold mb-2">Mark Attendance</h3>
        <form id="attForm" class="space-y-3">
          <input id="courseId" placeholder="Course ID" class="w-full px-3 py-2 border rounded" required />
          <div class="flex items-center space-x-3">
            <label class="flex items-center"><input type="radio" name="present" value="true" checked /> <span class="ml-2">Present</span></label>
            <label class="flex items-center"><input type="radio" name="present" value="false" /> <span class="ml-2">Absent</span></label>
          </div>
          <button class="bg-indigo-600 text-white px-4 py-2 rounded" type="submit">Mark</button>
        </form>
        <div id="attMsg" class="text-sm mt-3"></div>
      </div>

      <div class="mt-6 bg-white p-4 rounded shadow">
        <h3 class="font-semibold mb-2">Recent Attendance</h3>
        <div id="recentList" class="text-sm text-gray-700">Loading...</div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import {
      getFirestore,
      addDoc,
      collection,
      query,
      where,
      orderBy,
      limit,
      getDocs,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // --- replace with your Firebase config ---
    const firebaseConfig = {
      apiKey: "AIzaSyCqK5TUrvEHB8tBzegXf3g517EUouHvGtg",
      authDomain: "final-project-646be.firebaseapp.com",
      projectId: "final-project-646be",
      storageBucket: "final-project-646be.firebasestorage.app",
      messagingSenderId: "826790861451",
      appId: "1:826790861451:web:43fd311fc290419ab2928e"
    };
    // -----------------------------------------

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // require auth and render sidebar
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.replace('login.html'); // protected page
        return;
      }
      renderSidebar(user);
      await loadRecent(user.uid);
    });

    // Sidebar (simple)
    function renderSidebar(user) {
      const side = document.getElementById('sidebar');
      side.innerHTML = `
        <div class="p-6">
          <h2 class="text-2xl font-bold mb-4">Campus360</h2>
          <div class="mb-4">
            <div class="text-sm text-gray-700">${user.email}</div>
            <div class="text-xs text-gray-500">${user.email}</div>
          </div>
          <nav class="space-y-1">
            ${navLink('Dashboard','dashboard.html')}
            ${navLink('Attendance','attendance.html')}
            ${navLink('Courses','courses.html')}
            ${navLink('Library','library.html')}
            ${navLink('Timetable','timetable.html')}
            ${navLink('Notifications','notifications.html')}
            ${navLink('Profile','profile.html')}
            ${navLink('Settings','settings.html')}
            ${navLink('About','about.html')}
          </nav>
          <div class="mt-6">
            <button id="logoutBtn" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded">Logout</button>
          </div>
        </div>
      `;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
        location.replace('index.html');
      });
    }
    function navLink(t,h){ return `<a href="${h}" class="block px-3 py-2 rounded text-gray-700 hover:bg-gray-100">${t}</a>`; }

    // Submit attendance
    const attForm = document.getElementById('attForm');
    const attMsg = document.getElementById('attMsg');

    attForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      attMsg.textContent = '';
      const courseId = document.getElementById('courseId').value.trim();
      const present = document.querySelector('input[name="present"]:checked').value === 'true';

      try {
        const user = auth.currentUser;
        if (!user) throw new Error('Not signed in');

        // save attendance with server timestamp
        await addDoc(collection(db, 'attendance'), {
          uid: user.uid,
          courseId,
          present,
          date: serverTimestamp()
        });

        attMsg.textContent = 'Attendance recorded.';
        attMsg.className = 'text-green-600';
        attForm.reset();

        // immediately reload recent items so the new record appears
        await loadRecent(user.uid);
      } catch (err) {
        attMsg.textContent = err.message || 'Failed to save attendance';
        attMsg.className = 'text-red-600';
      }
    });

    // Load recent attendance for user
    async function loadRecent(uid) {
      const el = document.getElementById('recentList');
      el.textContent = 'Loading...';
      try {
        // query: filter by uid, order by date desc, show latest 8
        const q = query(
          collection(db, 'attendance'),
          where('uid', '==', uid),
          orderBy('date', 'desc'),
          limit(8)
        );
        const snaps = await getDocs(q);
        const rows = [];
        snaps.forEach(s => {
          const d = s.data();
          // handle serverTimestamp (Firestore Timestamp) or ISO string
          let dt = '';
          if (d.date && d.date.toDate) dt = d.date.toDate().toLocaleString();
          else if (d.date) dt = new Date(d.date).toLocaleString();
          else dt = '—';
          rows.push({ courseId: d.courseId, present: d.present, dateStr: dt });
        });

        if (rows.length === 0) {
          el.innerHTML = '<div class="text-gray-500">No records yet.</div>';
        } else {
          el.innerHTML = rows.map(r => `
            <div class="py-2 border-b">
              <div class="flex justify-between items-center">
                <div><strong>${escapeHtml(r.courseId)}</strong> <span class="text-xs text-gray-500">(${r.dateStr})</span></div>
                <div class="text-sm ${r.present ? 'text-green-600' : 'text-red-600'}">${r.present ? 'Present' : 'Absent'}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        // If Firestore asks for index, console will show link; handle gracefully
        el.innerHTML = `<div class="text-red-600">Could not load records. ${err.message || ''}</div>`;
      }
    }

    // small helper to avoid HTML injection
    function escapeHtml(s) {
      return String(s).replace(/[&<>"'`=\/]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'})[c]; });
    }

  </script>
</body>
</html>
