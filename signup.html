<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up — Campus360</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-indigo-50 to-white min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Create Your Account</h2>
    <form id="signupForm" class="space-y-3">
      <input required id="name" placeholder="Full name" class="w-full px-3 py-2 border rounded" />
      <input required id="email" type="email" placeholder="Email" class="w-full px-3 py-2 border rounded" />
      <input required id="password" type="password" placeholder="Password (min 6 chars)" class="w-full px-3 py-2 border rounded" />
      <input id="college" value="Karmaveer Bhaurao Patil Polytechnic Satara" placeholder="College (optional)" class="w-full px-3 py-2 border rounded" />
      <div class="flex justify-between items-center">
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Sign Up</button>
        <a href="login.html" class="text-sm text-indigo-600">Already have an account?</a>
      </div>
      <div id="msg" class="text-sm text-red-500"></div>
    </form>
  </div>

  <script type="module">
    // Firebase v9 modular imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // ---- REPLACE with your Firebase project's config ----
    const firebaseConfig = {

      apiKey: "AIzaSyCqK5TUrvEHB8tBzegXf3g517EUouHvGtg",
      authDomain: "final-project-646be.firebaseapp.com",
      projectId: "final-project-646be",
      storageBucket: "final-project-646be.firebasestorage.app",
      messagingSenderId: "826790861451",
      appId: "1:826790861451:web:43fd311fc290419ab2928e"
    };
    // ----------------------------------------------------
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // If already authed, go to dashboard
    onAuthStateChanged(auth, user => {
      if (user) location.replace('dashboard.html');
    });

    const form = document.getElementById('signupForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const college = document.getElementById('college').value.trim();
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        // save profile
        await setDoc(doc(db, 'users', cred.user.uid), {
          name, email, college, uid: cred.user.uid, createdAt: new Date().toISOString()
        });
        location.replace('dashboard.html');
      } catch (err) {
        msg.textContent = err.message || 'Signup failed';
      }
    });
  </script>
</body>
</html>
